# Metro Chile — configuración de empaquetado Linux (la usa "$(git rev-parse --show-toplevel)/herramientas"/linux-pkg/empaquetar.sh)
APP_ID=cl.kotone.MetroChile
PAQUETE=metro-chile
NOMBRE="Metro Chile"
NOMBRE_ARCHIVO=MetroChile
VERSION=$(cat "$APP/VERSION")
BIN_GUI=metro-chile
RESUMEN="Estado de la red del Metro de Santiago en vivo"
DESCRIPCION="Estado en vivo de las líneas y estaciones del Metro de Santiago, plano de la red y estación más cercana, con el clima del lugar. App no oficial, no afiliada a Metro S.A.; los datos son públicos de metro.cl."
DEPS_RPM="gtk4, webkitgtk6.0, json-glib, libcurl"
DEPS_DEB="libgtk-4-1, libwebkitgtk-6.0-4, libjson-glib-1.0-0, libcurl4t64 | libcurl4"
FLATPAK_EXTRA=""
SNAP_EXTRA=""

compilar() {
  local pre=$1 out=$2 w; w=$(mktemp -d)
  cp -a "$APP/desktop/." "$w/"; rm -f "$w"/metro-app "$w"/*.bak-*
  make -s -C "$w" ROOT="$pre/share/metro-chile" >/dev/null
  strip "$w/metro-app"; cp "$w/metro-app" "$out/metro-chile"
  rm -rf "$w"
}
instalar() {
  local st=$1 pre=$2 b=$3
  install -Dm755 "$b/metro-chile" "$st$pre/bin/metro-chile"
  mkdir -p "$st$pre/share/metro-chile"; cp -r "$APP/ui" "$st$pre/share/metro-chile/"
}
appimage_entorno() { echo 'export METRO_DIR="$HERE/usr/share/metro-chile"'; }
